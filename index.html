    function calcStatus(result, range) {
      if (result === '' || result == null) return '—';
      const num = parseFloat(String(result).replace(/[^0-9.\-]/g, ''));
      if (isNaN(num)) return '—';
      const r = String(range).trim();
      let m;
      if ((m = r.match(/^<\s*([\d.]+)/))) return num < parseFloat(m[1]) ? 'طبيعي' : 'مرتفع';
      if ((m = r.match(/^>\s*([\d.]+)/))) return num > parseFloat(m[1]) ? 'طبيعي' : 'منخفض';
      if ((m = r.match(/^([\d.]+)\s*[-–]\s*([\d.]+)/))) {
        const lo = parseFloat(m[1]), hi = parseFloat(m[2]);
        if (num < lo) return 'منخفض';
        if (num > hi) return 'مرتفع';
        return 'طبيعي';
      }
      return '—';
    }

        const id = uid();
        setToasts(t => [...t, { id, msg, type }]);
        setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);

      return { toasts, push };

 // ============ APP ============

  const [showAdd, setShowAdd] = useState(false);
  const [modal, setModal] = useState(null); // 'view' | 'print' | 'pdf'
  const [query, setQuery] = useState('');
  const [catFilter, setCatFilter] = useState('الكل');
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [showPatients, setShowPatients] = useState(false);
  const [busy, setBusy] = useState(false);
  const { toasts, push } = useToasts();
  const printRef = useRef(null);

  // حفظ تلقائي
  useEffect(() => { saveLS(LS_KEYS.current, patient); }, [patient]);
  useEffect(() => { saveLS(LS_KEYS.current + '_tests', tests); }, [tests]);
  useEffect(() => { saveLS(LS_KEYS.current + '_note', note); }, [note]);

  // Esc لإغلاق المودالات
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') {
        setShowAdd(false); setModal(null); setDrawerOpen(false); setShowPatients(false);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const filteredCatalog = useMemo(() => {
    let list = FLAT_CATALOG;
    if (catFilter !== 'الكل') list = list.filter(x => x.cat === catFilter);
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      list = list.filter(x => x.name.toLowerCase().includes(q) || x.cat.includes(q));
    }
    return list;
  }, [query, catFilter]);

  // ===== Actions =====
  const updatePatient = (patch) => setPatient(p => ({ ...p, ...patch }));

  const validatePatient = () => {

        showAdd && h('div', { key: 'add', className: 'fixed inset-0 z-50 flex items-center justify-center p-3' }, [
          h('div', { key: 'bg', className: 'absolute inset-0 bg-black/50', onClick: () => setShowAdd(false) }),
          h('div', { key: 'p', className: 'relative w-full max-w-2xl bg-white rounded-2xl shadow-2xl overflow-hidden max-h-[85vh] flex flex-col' }, [
            h('div', { key: 'h', className: 'p-4 border-b flex items-center justify-between' }, [
              h('div', { key: 't', className: 'flex items-center gap-2' }, [
                h('div', { key: 'i', className: 'w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center' }, h(IconTest, { size: 16 })),
                h('div', { key: 'x' }, [
                  h('h3', { key: 'a', className: 'font-extrabold text-[14px]' }, 'إضافة تحليل'),
                  h('p', { key: 'b', className: 'text-[11px] text-slate-500' }, `${FLAT_CATALOG.length} تحليل متاح`),
                ]),
              ]),
              h('button', { key: 'x', onClick: () => setShowAdd(false), className: 'w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 flex items-center justify-center' }, h(IconX, { size: 16 })),
            ]),
            h('div', { key: 'f', className: 'p-3 border-b bg-[#f8fafc] flex flex-col gap-2' }, [
              h('div', { key: 's', className: 'relative' }, [
                h(IconSearch, { key: 'i', size: 16, className: 'absolute right-3 top-1/2 -translate-y-1/2 text-slate-400' }),
                h('input', { key: 'in', autoFocus: true, value: query, onChange: e => setQuery(e.target.value), placeholder: 'ابحث عن تحليل...', className: 'w-full h-10 pr-9 pl-3 rounded-xl border border-slate-200 bg-white text-[13px] focus:outline-none focus:ring-2 focus:ring-blue-200' }),
              ]),
              h('div', { key: 'c', className: 'flex gap-1.5 overflow-x-auto scrollbar-none pb-1' },
                ['الكل', ...CATALOG.map(c => c.cat)].map(c =>
                  h('button', { key: c, onClick: () => setCatFilter(c), className: `shrink-0 px-3 py-1.5 rounded-lg text-[12px] font-bold min-h-[32px] ${catFilter === c ? 'bg-[#2563eb] text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}` }, c)
                )
              ),
            ]),
            h('div', { key: 'l', className: 'overflow-y-auto flex-1 p-2' },
              filteredCatalog.length === 0
                ? h('div', { className: 'p-6 text-center text-slate-500 text-[13px]' }, 'لا توجد نتائج')
                : filteredCatalog.map(item =>
                    h('button', { key: item.id, onClick: () => addTest(item), className: 'w-full flex items-center justify-between p-2.5 rounded-xl hover:bg-blue-50 border border-transparent hover:border-blue-100 text-right' }, [
                      h('div', { key: 'l', className: 'flex flex-col items-start' }, [
                        h('span', { key: 'n', className: 'font-bold text-[13px]' }, item.name),
                        h('span', { key: 'c', className: 'text-[11px] text-slate-500' }, `${item.cat} • ${item.unit} • ${item.range}`),
                      ]),
                      h(IconPlus, { key: 'i', size: 16, className: 'text-blue-600' }),
                    ])
                  )
            ),
          ]),
        ]),

        // ===== VIEW / PRINT / PDF MODAL =====
        modal && h('div', { key: 'modal', className: 'fixed inset-0 z-50 flex items-center justify-center p-2 lg:p-6' }, [
          h('div', { key: 'bg', className: 'no-print absolute inset-0 bg-black/60', onClick: () => setModal(null) }),
          h('div', { key: 'p', className: 'relative w-full max-w-4xl bg-white rounded-2xl shadow-2xl overflow-hidden max-h-[92vh] flex flex-col' }, [
            h('div', { key: 'h', className: 'no-print p-3 lg:p-4 bg-[#0f172a] text-white flex items-center justify-between' }, [
              h('div', { key: 't', className: 'flex items-center gap-2' }, [
                h(IconFile, { key: 'i', size: 18 }),
                h('span', { key: 's', className: 'font-bold text-[13px]' }, modal === 'print' ? 'معاينة الطباعة' : modal === 'pdf' ? 'حفظ PDF' : 'عرض النتيجة'),
              ]),
              h('div', { key: 'a', className: 'flex items-center gap-2' }, [
                h('button', { key: 'p', onClick: doPrint, disabled: busy, className: 'px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-[12px] flex items-center gap-1 disabled:opacity-50' }, [h(IconPrint, { key: 'i', size: 14 }), ' طباعة']),
                h('button', { key: 'd', onClick: doPdf, disabled: busy, className: 'px-3 py-1.5 rounded-lg bg-[#dc2626] hover:bg-red-700 text-[12px] flex items-center gap-1 disabled:opacity-50' }, [h(IconPdf, { key: 'i', size: 14 }), busy ? 'جارٍ...' : ' PDF']),
                h('button', { key: 'x', onClick: () => setModal(null), className: 'w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center' }, h(IconX, { size: 16 })),
              ]),
            ]),
            h('div', { key: 'b', className: 'overflow-y-auto flex-1 bg-[#f1f5f9] p-3 lg:p-6' },
              h('div', { key: 'doc', id: 'print-area', ref: printRef, className: 'bg-white rounded-xl shadow-sm border border-slate-200 p-6 max-w-3xl mx-auto' }, [
                // HEAD
                h('div', { key: 'h', className: 'flex justify-between items-start border-b-2 border-[#2563eb] pb-4 mb-4' }, [
                  h('div', { key: 'l', className: 'flex gap-3' }, [
                    h('div', { key: 'i', className: 'w-12 h-12 rounded-xl bg-[#2563eb] flex items-center justify-center text-white' }, h(IconFlask, { size: 24 })),
                    h('div', { key: 't' }, [
                      h('div', { key: 'a', className: 'font-extrabold text-[18px]' }, 'مختبر النجف التخصصي'),
                      h('div', { key: 'b', className: 'text-[11px] text-slate-500' }, 'Najaf Specialized Laboratory'),
                      h('div', { key: 'c', className: 'text-[10px] text-slate-400 mt-1' }, 'النجف - شارع الكوفة | 0780xxxxxxx'),
                    ]),
                  ]),
                  h('div', { key: 'r', className: 'text-left' }, [
                    h('div', { key: 'a', className: 'text-[11px] text-slate-500' }, 'رقم العينة: ', patient.number || '—'),
                    h('div', { key: 'b', className: 'text-[11px] text-slate-500' }, 'التاريخ: ', todayAr()),
                    h('div', { key: 'c', className: 'mt-1 inline-flex px-2 py-0.5 rounded bg-emerald-100 text-emerald-700 text-[10px] font-bold' }, 'تم التحقق'),
                  ]),
                ]),
                // PATIENT INFO
                h('div', { key: 'p', className: 'grid grid-cols-2 lg:grid-cols-4 gap-3 text-[12px] mb-5 bg-[#f8fafc] p-3 rounded-xl border' }, [
                  h('div', { key: 'n' }, [h('span', { key: 'l', className: 'text-slate-500' }, 'الاسم: '), h('span', { key: 'v', className: 'font-bold' }, patient.name || '—')]),
                  h('div', { key: 'g' }, [h('span', { key: 'l', className: 'text-slate-500' }, 'الجنس/العمر: '), h('span', { key: 'v', className: 'font-bold' }, `${patient.gender} - ${patient.age || '—'} سنة`)]),
                  h('div', { key: 'ph' }, [h('span', { key: 'l', className: 'text-slate-500' }, 'الهاتف: '), h('span', { key: 'v', className: 'font-bold' }, patient.phone || '—')]),
                  h('div', { key: 'd' }, [h('span', { key: 'l', className: 'text-slate-500' }, 'الطبيب: '), h('span', { key: 'v', className: 'font-bold' }, patient.doctor || '—')]),
                ]),
                // TABLE
                h('table', { key: 't', className: 'w-full text-[12px] border border-slate-200 rounded-lg overflow-hidden' }, [
                  h('thead', { key: 'h', className: 'bg-[#1e293b] text-white text-[11px]' },
                    h('tr', null, [
                      h('th', { key: 'a', className: 'py-2 px-3 text-right' }, 'التحليل'),
                      h('th', { key: 'b', className: 'py-2 px-3' }, 'النتيجة'),
                      h('th', { key: 'c', className: 'py-2 px-3' }, 'الوحدة'),
                      h('th', { key: 'd', className: 'py-2 px-3' }, 'الطبيعي'),
                      h('th', { key: 'e', className: 'py-2 px-3' }, 'الحالة'),
                    ])
                  ),
                  h('tbody', { key: 'b' }, tests.filter(t => t.checked).map((t, i) => {
                    const st = calcStatus(t.result, t.range);
                    return h('tr', { key: t.id, className: i % 2 === 0 ? 'bg-white' : 'bg-slate-50' }, [
                      h('td', { key: 'a', className: 'py-2 px-3 font-bold' }, t.name),
                      h('td', { key: 'b', className: 'py-2 px-3 text-center font-bold' }, t.result || '-'),
                      h('td', { key: 'c', className: 'py-2 px-3 text-center text-slate-600' }, t.unit),
                      h('td', { key: 'd', className: 'py-2 px-3 text-center text-slate-600' }, t.range),
                      h('td', { key: 'e', className: 'py-2 px-3 text-center' },
                        h('span', { className: `px-2 py-0.5 rounded-full text-[10px] font-bold ${statusColor(st)}` }, st)
                      ),
                    ]);
                  }))
                ]),
                // NOTES
                note && h('div', { key: 'n', className: 'mt-4 p-3 rounded-xl bg-amber-50 border border-amber-200 text-[12px]' }, [
                  h('strong', { key: 's' }, 'ملاحظات: '), note,
                ]),
                // FOOTER
                h('div', { key: 'f', className: 'mt-6 flex justify-between items-end text-[10px] text-slate-500 border-t pt-3' }, [
                  h('div', { key: 'l' }, ['المسؤول: حسين فني مختبر', h('br', { key: 'b' }), 'التوقيع: ___________']),
                  h('div', { key: 'r', className: 'text-left' }, ['نتمنى لكم الشفاء العاجل', h('br', { key: 'b' }), 'هذا التقرير صالح لمدة شهر']),
                ]),
              ])
            ),
            // WHATSAPP BAR
            h('div', { key: 'w', className: 'no-print p-3 border-t bg-white flex flex-col sm:flex-row gap-2 items-stretch sm:items-center' }, [
              h('div', { key: 'f', className: 'flex-1 relative' }, [
                h(IconPhone, { key: 'i', size: 14, className: 'absolute right-3 top-1/2 -translate-y-1/2 text-slate-400' }),
                h('input', { key: 'in', value: patient.phone, onChange: e => updatePatient({ phone: e.target.value }), placeholder: '078xxxxxxxx', className: 'w-full h-10 pr-9 pl-3 rounded-lg border border-slate-200 bg-[#f8fafc] text-[13px]' }),
              ]),
              h('button', { key: 's', onClick: sendWhatsApp, className: 'h-10 px-4 rounded-lg bg-[#25D366] hover:bg-[#128C7E] text-white text-[12px] font-bold flex items-center justify-center gap-1' }, [h(IconWhats, { key: 'i', size: 14 }), ' إرسال واتساب']),
            ]),
          ]),
        ]),

        // ===== PATIENTS LIST MODAL =====
        showPatients && h('div', { key: 'pl', className: 'fixed inset-0 z-50 flex items-center justify-center p-3' }, [
          h('div', { key: 'bg', className: 'absolute inset-0 bg-black/50', onClick: () => setShowPatients(false) }),
          h('div', { key: 'p', className: 'relative w-full max-w-3xl bg-white rounded-2xl shadow-2xl overflow-hidden max-h-[85vh] flex flex-col' }, [
            h('div', { key: 'h', className: 'p-4 border-b flex items-center justify-between' }, [
              h('div', { key: 't', className: 'flex items-center gap-2' }, [
                h('div', { key: 'i', className: 'w-8 h-8 rounded-lg bg-[#2563eb] text-white flex items-center justify-center' }, h(IconUsers, { size: 16 })),
                h('div', { key: 'x' }, [
                  h('h3', { key: 'a', className: 'font-extrabold text-[14px]' }, 'قائمة المرضى'),
                  h('p', { key: 'b', className: 'text-[11px] text-slate-500' }, `${patients.length} ملف محفوظ`),
                ]),
              ]),
              h('button', { key: 'x', onClick: () => setShowPatients(false), className: 'w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 flex items-center justify-center' }, h(IconX, { size: 16 })),
            ]),
            h('div', { key: 'b', className: 'overflow-y-auto flex-1 p-3' },
              patients.length === 0
                ? h('div', { className: 'p-6 text-center text-slate-500 text-[13px]' }, 'لا يوجد مرضى محفوظون بعد')
                : h('div', { className: 'flex flex-col gap-2' }, patients.map(p =>
                    h('div', { key: p.id, className: 'flex items-center justify-between p-3 rounded-xl border border-slate-200 hover:bg-slate-50' }, [
                      h('div', { key: 'l', className: 'flex flex-col' }, [
                        h('span', { key: 'n', className: 'font-bold text-[13px]' }, p.name || '—'),
                        h('span', { key: 'i', className: 'text-[11px] text-slate-500' }, `${p.number || ''} • ${p.age || ''} سنة • ${p.phone || ''}`),
                      ]),
                      h('div', { key: 'r', className: 'flex items-center gap-1' }, [
                        h('button', { key: 'o', onClick: () => loadPatient(p), className: 'px-3 py-1.5 rounded-lg bg-[#2563eb] hover:bg-blue-700 text-white text-[12px] font-bold' }, 'فتح'),
                        h('button', { key: 'd', onClick: () => deletePatient(p.id), className: 'w-8 h-8 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 flex items-center justify-center' }, h(IconTrash, { size: 14 })),
                      ]),
                    ])
                  ))
            ),
          ]),
        ]),

        // ===== TOASTS =====
        h('div', { key: 'toasts', className: 'fixed bottom-4 right-4 z-[60] flex flex-col gap-2 pointer-events-none' },
          toasts.map(t =>
            h('div', { key: t.id, className: `px-4 py-2.5 rounded-xl shadow-2xl text-[13px] font-bold flex items-center gap-2 animate-fade ${t.type === 'error' ? 'bg-[#7f1d1d] text-white' : 'bg-[#0f172a] text-white'}` }, [
              h('div', { key: 'i', className: 'w-6 h-6 rounded-full bg-white/15 flex items-center justify-center' }, h(t.type === 'error' ? IconX : IconCheck, { size: 14 })),
              t.msg,
            ])
          )
        ),
      ]);
    }

    // ============ HELPERS FOR RENDER ============
    const inputCls = 'h-11 lg:h-9 px-3 rounded-xl lg:rounded-lg border border-slate-200 bg-[#f8fafc] text-[14px] lg:text-[13px] focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 w-full';

    function field(label, input) {
      return h('div', { className: 'flex flex-col gap-1' }, [
        h('label', { key: 'l', className: 'text-[12px] font-bold text-slate-600' }, label),
        h('div', { key: 'i' }, input),
      ]);
    }

    // ============ MOUNT ============
    const root = createRoot(document.getElementById('root'));
    root.render(h(App));
  </script>
</body>
</html>
